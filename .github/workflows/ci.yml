name: Tests and version checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check version metadata
        run: python3 scripts/versions.py check
      - name: Reject mismatched release tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/versions.py check --tag "$RELEASE_TAG"
      - name: Test core storage and synchronization
        run: npm test
      - name: Install locked mobile dependencies
        run: npm ci --prefix mobile
      - name: Compile mobile adapter
        run: node mobile/build.cjs
      - name: Check Python source
        run: python3 -m compileall -q scripts android
